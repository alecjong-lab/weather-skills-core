[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-skills-core"
version = "0.1.0"
description = "Core library for weather skills: the @weather_skill decorator owning CLI construction, standard-dataset validation, provenance, and output writing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cf-xarray>=0.11",
    "cftime>=1.6",
    "numpy>=2.5",
    "pillow>=10",
    "xarray>=2026.7",
    "zarr>=3.2",
]

[project.scripts]
weather-skills-core = "weather_skills_core.linting.cli:main"

[project.optional-dependencies]
# udunits validation: cf.udunits_error
units = ["cf-units>=3.3.1"]
# GeoJSON / region: shapely + geopandas (polygon helpers, --region → GeoDataFrame)
geo = ["shapely>=2.1.2", "geopandas>=1.0"]

[dependency-groups]
dev = [
    "cf-units>=3.3.1",
    "geopandas>=1.0",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff>=0.16",
    "shapely>=2.1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weather_skills_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/weather_skills_core/data/countries.geojson" = "weather_skills_core/data/countries.geojson"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # zarr-python warns on every consolidated write; consolidated=True is part
    # of the standard dataset contract, so the warning is expected noise in tests.
    "ignore:Consolidated metadata is currently not part in the Zarr format 3 specification",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The broken-syntax lint fixture deliberately does not parse (it exercises the
# linter's unparseable-script finding); ruff must not try to check it.
extend-exclude = ["tests/fixtures/linting/errors_tree/skills/broken-syntax"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
